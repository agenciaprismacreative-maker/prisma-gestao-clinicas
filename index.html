<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sua Atualização</title>
<meta name="description" content="Suas músicas no aparelho, tocando mesmo sem internet.">
<meta name="theme-color" content="#0E1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sua Atualização">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --raised:#E2E7F2; --line:#CDD5E6;
  --text:#121829; --muted:#555E78;
  --accent:#F2A100; --on-accent:#1B1400; --accent-ink:#8A5600;
  --led:#2447D6; --danger:#C3243A; --ok:#0A7F66;
  --scrim:rgba(10,14,28,.5);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --surface:#171E33; --raised:#222B47; --line:#2E3959;
    --text:#F1F3FA; --muted:#9BA5C2;
    --accent:#FFB020; --on-accent:#1B1400; --accent-ink:#FFC457;
    --led:#7A9DFF; --danger:#FF6B7D; --ok:#3ED6B4;
    --scrim:rgba(4,6,14,.66);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E33; --raised:#222B47; --line:#2E3959;
  --text:#F1F3FA; --muted:#9BA5C2;
  --accent:#FFB020; --on-accent:#1B1400; --accent-ink:#FFC457;
  --led:#7A9DFF; --danger:#FF6B7D; --ok:#3ED6B4;
  --scrim:rgba(4,6,14,.66);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:'Archivo','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
[hidden]{display:none !important}

.shell{max-width:600px;margin:0 auto;padding:0 16px 190px}
.cond{font-stretch:62%;font-weight:800;letter-spacing:.01em}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;line-height:1;text-transform:uppercase}
.brand-mark{display:flex;align-items:flex-end;gap:2px;height:20px}
.brand-mark i{width:5px;background:var(--accent);border-radius:1px}
.brand-mark i:nth-child(1){height:8px}.brand-mark i:nth-child(2){height:20px}.brand-mark i:nth-child(3){height:13px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off::before{background:var(--accent)}
.backbtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 2px;border:0;background:none;font-weight:600}

/* tipografia de tela */
.h-screen{font-size:30px;line-height:1.05;margin:10px 0 4px}
.sub{color:var(--muted);font-size:14px}
.sec{margin-top:28px}
.sec > h2{font-size:18px;font-weight:700;margin-bottom:10px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;
  border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;width:100%;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{min-height:44px;width:auto;padding:0 14px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;border-radius:50%;color:var(--muted);flex:none}
.ib.on{color:var(--accent-ink)}
.ib.on svg path{fill:currentColor}
.link{border:0;background:none;padding:0;min-height:44px;color:var(--led);font-weight:600;text-align:left}

/* capas */
.cover{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;container-type:inline-size;width:100%}
.cv-in{position:absolute;inset:0;padding:16px;padding:8cqw;display:flex;flex-direction:column;justify-content:space-between}
.cv-tag{font-size:12px;font-size:6.2cqw;font-weight:700;line-height:1.1;max-width:62%}
.cv-big{font-stretch:62%;font-weight:900;line-height:.84;text-transform:uppercase;font-size:2.4rem}
.cv-big.xl{font-size:40cqw}.cv-big.lg{font-size:30cqw}.cv-big.md{font-size:22cqw}
.cv-vu{position:absolute;top:8cqw;right:8cqw;display:flex;align-items:flex-start;gap:1.6cqw;height:26cqw;opacity:.42}
.cv-vu i{width:3.2cqw;background:currentColor;border-radius:1px}
@container (max-width: 140px){.cv-tag{display:none}.cv-in{justify-content:flex-end}}
@container (max-width: 90px){.cv-vu{display:none}}
.cv-a{background:#F2A100;color:#141B30}
.cv-b{background:#2447D6;color:#F4F6FC}
.cv-c{background:#D92B45;color:#FFF3E2}
.cv-d{background:#0E9C8F;color:#0B1222}
.cv-e{background:#141B30;color:#FFB020}

/* biblioteca */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;margin-top:16px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:block;border:0;background:none;padding:0;text-align:left;width:100%}
.card-t{display:block;font-weight:700;margin-top:8px;line-height:1.2}
.card-s{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);margin-top:3px}
.card-s svg{width:14px;height:14px}
.card-s.ok{color:var(--ok)}

/* medidor de segmentos */
.vu{display:flex;gap:3px;height:16px}
.vu i{flex:1;background:var(--line);border-radius:2px}
.vu i.on{background:var(--accent)}
.dlbox{background:var(--surface);border-radius:12px;padding:14px}
.dlbox-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;font-size:14px}

/* pacote */
.pk-head{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:end;margin:6px 0 18px}
.pk-head h1{font-size:26px;line-height:1.05}
.pk-meta{color:var(--muted);font-size:14px;margin-top:6px}
.pk-extra{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px}
.note{font-size:13px;color:var(--muted);margin-top:8px}

/* faixas */
.trks{margin-top:18px}
.trk{display:grid;grid-template-columns:26px minmax(0,1fr) auto 44px 44px;align-items:center;gap:6px;min-height:58px;
  border-bottom:1px solid var(--line);cursor:pointer}
.trk-n{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.trk-n svg{width:16px;height:16px;color:var(--accent-ink)}
.trk-m{min-width:0}
.trk-t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-a{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.trk-a span{overflow:hidden;text-overflow:ellipsis}
.trk-a svg{width:13px;height:13px;flex:none}
.trk-a svg.ok{color:var(--ok)}
.trk-d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.trk.is-cur .trk-t{color:var(--accent-ink)}
.trk.is-off .trk-t{color:var(--muted)}

/* loja */
.offer{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.offer h3{font-size:17px;line-height:1.2}
.offer .price{font-weight:800;font-size:18px;margin-top:6px}
.offer-a{grid-column:1 / -1;display:grid;grid-template-columns:1fr auto;gap:10px}
.plan{background:var(--surface);border-radius:12px;padding:16px;margin-top:16px}
.plan h2{font-size:18px}
.plan p{color:var(--muted);font-size:14px;margin:4px 0 12px}

/* campos */
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.inp:focus{border-color:var(--led);outline:none}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.search{position:relative;margin-top:12px}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.search .inp{padding-left:46px}
.radio{display:flex;align-items:center;gap:10px;min-height:44px}
.radio input{width:20px;height:20px;accent-color:var(--led)}

/* listas e linhas genéricas */
.line{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.line-ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:var(--raised);flex:none}
.line-m{flex:1;min-width:0}
.line-m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-m small{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--raised)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--danger)}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.empty .btn{width:auto;margin-top:14px}

/* conta e painel */
.panel{background:var(--surface);border-radius:12px;padding:16px;margin-top:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.kv span:first-child{color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;border:0;background:none;padding:0;text-align:left;font-weight:600}
.switch i{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"] i{background:var(--led)}
.switch[aria-checked="true"] i::after{transform:translateX(18px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--raised);padding:4px;border-radius:10px;margin-top:14px}
.seg button{min-height:40px;border:0;border-radius:7px;background:none;font-weight:600;font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface)}
.seg.two{grid-template-columns:1fr 1fr}
a.btn{text-decoration:none}
.kv span:last-child,.kv b{text-align:right;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px;line-height:1.1;font-stretch:75%;font-weight:800}
.stat small{color:var(--muted);font-size:12px}
.barrow{margin-top:12px;font-size:14px}
.barrow-h{display:flex;justify-content:space-between;gap:10px}
.bar{height:10px;border-radius:2px;background:var(--raised);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--led)}
.client{padding:12px 0;border-bottom:1px solid var(--line)}
.client-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.client-a{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:8px}
.client-a select{min-height:44px;min-width:0}

/* barra inferior */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:600px;margin:0 auto}
.mini{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 44px 44px;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.mini-bar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.mini-bar i{display:block;height:100%;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
.mini .ib{color:var(--text)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 2px 2px}
.tab .dot{position:absolute;top:9px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--danger)}

/* folhas */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow:auto;
  border-radius:20px 20px 0 0;padding:16px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet-h h2{font-size:20px;line-height:1.15}
.sheet p.lead{color:var(--muted);margin-bottom:14px}
.sheet .btn + .btn{margin-top:10px}

/* player */
.pl-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}
.pl-from{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-cover{width:min(52vw,220px);margin:8px auto 14px}
.pl-vu{display:block;width:100%;height:64px}
.pl-t{font-size:22px;line-height:1.15;margin-top:12px}
.pl-a{color:var(--muted)}
#seek{width:100%;height:44px;margin:4px 0 0;accent-color:var(--accent)}
.pl-time{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-6px}
.pl-ctl{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.pl-ctl .ib{position:relative;color:var(--text)}
.pl-ctl .ib.on{color:var(--accent-ink)}
.pl-ctl .ib.on svg path{fill:none}
.pl-ctl .ib sup{position:absolute;top:4px;right:4px;font-size:10px;font-weight:800}
.pl-main{width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.pl-main svg{width:30px;height:30px}
.pl-q{margin-top:14px}
.pl-q h3{font-size:15px;color:var(--muted);font-weight:600}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 0 48px}
.login h1{font-size:clamp(44px,14.5vw,92px);line-height:.86;text-transform:uppercase;font-stretch:62%;font-weight:900;overflow:hidden}
.login .vu{height:22px;margin:18px 0 16px}
.login .vu i.on{animation:seg .28s ease-out both}
@keyframes seg{from{background:var(--line)}to{background:var(--accent)}}
.login .lead{font-size:18px;max-width:30ch}
.login .btn{margin-top:20px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;
  background:var(--text);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:min(92vw,520px);
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>
<div class="scrim" id="scrim" data-a="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="supabase.js"></script>
<script>
(function(){

function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ================= ícones ================= */
const svg = d => '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const I = {
  play: svg('<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>'),

  repeat: svg('<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>'),
  heart: svg('<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.060a5.5 5.5 0 000-7.780z"/>'),
  download: svg('<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.500"/>'),
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.200-4.200"/>'),
  disc: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>'),

/* ================= gerador das faixas de demonstração ================= */
const SR = 22050;
function synth(seedN, secs){
  const r = rng(seedN), nz = rng(seedN ^ 0x9E3779B9);
  const scales = [[0,2,4,7,9],[0,2,4,5,7,9,10],[0,3,5,7,10],[0,2,3,5,7,8,10]];
  const sc = scales[Math.floor(r() * scales.length)];
  const root = 98 * Math.pow(2, Math.floor(r() * 7) / 12);
  const bpm = 92 + Math.floor(r() * 56);
  const step = 60 / bpm / 2, stepN = step * SR;
  const mel = []; let d = Math.floor(r() * sc.length);
  for (let i = 0; i < 32; i++){ d = clamp(d + Math.floor(r() * 5) - 2, 0, sc.length * 2 - 1); mel.push(r() < 0.22 ? -1 : d); }
  const chords = [0, 3 % sc.length, r() < 0.5 ? 4 % sc.length : 2, 0];
  const freq = g => root * Math.pow(2, (sc[g % sc.length] + 12 * Math.floor(g / sc.length)) / 12);
  const n = Math.floor(secs * SR), out = new Int16Array(n), TAU = Math.PI * 2;
  for (let i = 0; i < n; i++){
    const si = Math.floor(i / stepN), ts = (i - si * stepN) / SR, sb = si % 8, bar = Math.floor(si / 8);
    let v = 0;
    const m = mel[si % 32];
    if (m >= 0){ const f = freq(m) * 4; v += (Math.sin(TAU * f * ts) + 0.4 * Math.sin(TAU * 2 * f * ts)) * Math.exp(-ts * 7) * 0.2; }
    const hb = sb < 3 ? 0 : sb < 6 ? 3 : 6, tb = (sb - hb) * step + ts;
    v += Math.sin(TAU * freq(chords[bar % 4]) * tb) * Math.exp(-tb * 4) * 0.4;
    v += Math.sin(TAU * (48 * tb + (82 / 28) * (1 - Math.exp(-tb * 28)))) * Math.exp(-tb * 14) * 0.55;
    v += (nz() * 2 - 1) * (sb % 2 === 1 ? 0.1 : 0.05) * Math.exp(-ts * 60);
    const fade = Math.min(1, i / (SR * 0.3), (n - i) / (SR * 1.2));
    out[i] = Math.tanh(v * 1.3) * fade * 30000;
  }
  return out;
}

/* medidor do player */
let vuColors = null, vuColorsAt = 0, freqArr = null;
function drawVU(){
  const cv = $('#vu'); if (!cv) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, hgt = cv.clientHeight; if (!w) return;
  if (cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
  const now = Date.now();
  if (!vuColors || now - vuColorsAt > 1500){ const cs = getComputedStyle(document.documentElement); vuColors = { on: cs.getPropertyValue('--accent').trim(), hot: cs.getPropertyValue('--danger').trim(), off: cs.getPropertyValue('--line').trim() }; vuColorsAt = now; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, hgt);
  const cols = 24, rows = 8, gap = 3, cw = (w - gap * (cols - 1)) / cols, rh = (hgt - gap * (rows - 1)) / rows;
  let data = null;
  if (P.an && P.playing){ if (!freqArr) freqArr = new Uint8Array(P.an.frequencyBinCount); P.an.getByteFrequencyData(freqArr); data = freqArr; }
  for (let c = 0; c < cols; c++){
    const lvl = data ? data[Math.min(data.length - 1, Math.floor(Math.pow(c / cols, 1.5) * 40))] / 255 : 0;
    const lit = Math.round(lvl * rows);
    for (let r = 0; r < rows; r++){
      g.fillStyle = r < lit ? (r >= rows - 2 ? vuColors.hot : vuColors.on) : vuColors.off;
      g.fillRect(c * (cw + gap), hgt - (r + 1) * rh - r * gap, cw, rh);
    }
  }
}
function tick(){
  const d = P.buf ? P.buf.duration : 0, p = pos(), frac = d ? p / d : 0;
  const mbEl = $('#miniBar'); if (mbEl) mbEl.style.transform = 'scaleX(' + frac.toFixed(4) + ')';
  if (UI.sheet && UI.sheet.type === 'player'){
    if (!UI.seeking){ const sk = $('#seek'); if (sk) sk.value = Math.round(frac * 1000); const ct = $('#curT'); if (ct) ct.textContent = fmt(p); }
    drawVU();
  }
  requestAnimationFrame(tick);
}

/* ----- sincronização com o servidor ----- */
const SYNC = { busy: false, last: 0, profileName: '' };
async function pruneAudio(){
  try {
    const keys = await audioKeys();
    for (const k of keys){ if (!T.has(k)){ await audioDel(k); delete S.dl[k]; } }
    Object.keys(S.dl).forEach(k => { if (!T.has(k)) delete S.dl[k]; });
    save();
  } catch (e) {}
}
async function syncAll(force){
  if (!sb || !S.user || !S.user.id || SYNC.busy) return false;
  if (!force && Date.now() - SYNC.last < 15000) return false;
  SYNC.busy = true;
  try {
    const uid = S.user.id;
    const r = await Promise.all([
      sb.from('profiles').select('name,phone,email,is_admin,blocked').eq('id', uid).maybeSingle(),
      sb.from('packs').select('id,title,genre,price_cents,release_at,cover_variant,cover_label,tracks(id,position,title,artist,duration_seconds,demo_seed)').order('release_at', { ascending: false }),
      sb.from('purchases').select('pack_id').eq('user_id', uid),
      sb.from('subscriptions').select('status,license_until').eq('user_id', uid).maybeSingle()
    ]);
    const bad = r.find(x => x.error); if (bad) throw bad.error;
    const pr = r[0].data, sub = r[3].data;
    if (pr){ SYNC.profileName = pr.name || ''; S.user.name = pr.name || S.user.name || ''; S.user.email = pr.email || S.user.email || ''; S.user.phone = pr.phone ? '+' + String(pr.phone).replace(/^\+/, '') : (S.user.phone || ''); S.isAdmin = !!pr.is_admin; S.blocked = !!pr.blocked; }
    if (!S.isAdmin) S.admin = false;
    S.packs = (r[1].data || []).map(p => ({
      id: p.id, title: p.title, genre: p.genre || '', price: (p.price_cents || 0) / 100, release: p.release_at, cv: p.cover_variant || 'a',
      big: (p.cover_label && p.cover_label.length) ? p.cover_label : bigFrom(p.title),
      tracks: (p.tracks || []).slice().sort((a, b) => a.position - b.position).map(t => ({ id: t.id, t: t.title, a: t.artist || '', d: t.duration_seconds || 20, seed: Number(t.demo_seed) || hash(t.id), src: 'demo' }))
    }));
    S.owned = (r[2].data || []).map(x => x.pack_id);
    S.sub = !!sub && sub.status !== 'canceled'; S.subStatus = sub ? sub.status : ''; S.subUntil = sub ? sub.license_until : '';
    S.syncedAt = Date.now(); SYNC.last = Date.now();
    index(); enforceAccess(); if (S.blocked) stopAll(); save();
    await pruneAudio();
    return true;
  } catch (e) { return false; }
  finally { SYNC.busy = false; }
}

function authMsg(e, fallback){

    ]);
    const bad = r.find(x => x.error); if (bad) throw bad.error;
    ADM.clients = r[0].data || []; ADM.purchases = r[1].data || []; ADM.subs = r[2].data || []; ADM.loaded = true; ADM.err = '';
  } catch (e) { ADM.err = 'Não foi possível carregar os dados. Confira a internet e tente de novo.'; }
  ADM.loading = false;
  if (S.user && cur().type === 'conta') renderView();
}
async function adminDone(res, okMsg, uid){
  if (res && res.error){ toast('Não foi possível salvar. Confira a internet e tente de novo.'); return false; }
  toast(okMsg);
  await loadAdmin();
  if (uid && S.user && uid === S.user.id){ await syncAll(true); render(); }
  return true;
}
async function savePack(){
  const name = $('#npName').value.trim(), genre = $('#npGenre').value, rel = $('#npDate').value;
  const price = parseFloat(String($('#npPrice').value).replace(/[^\d.,]/g, '').replace(',', '.'));
  let bad = false;
  if (!name){ showErr('errNpName', 'Dê um nome ao pacote.'); bad = true; } else showErr('errNpName');
  if (!(price >= 0)){ showErr('errNpPrice', 'Informe um preço em reais, por exemplo 15,00.'); bad = true; } else showErr('errNpPrice');
  if (bad || !sb) return;
  const btn = $('#npSave'); btn.disabled = true; btn.textContent = 'Criando pacote...';
  const fail = () => { btn.disabled = false; btn.textContent = 'Criar pacote'; showErr('errNpName', 'Não foi possível criar o pacote. Confira a internet e tente de novo.'); };
  const releaseAt = rel ? new Date(rel + 'T00:00:00').toISOString() : new Date().toISOString();
  const ins = await sb.from('packs').insert({ title: name, genre: genre, price_cents: Math.round(price * 100), release_at: releaseAt, cover_variant: 'abcde'[S.packs.length % 5], cover_label: bigFrom(name) }).select('id').single();
  if (ins.error || !ins.data){ fail(); return; }
  const id = ins.data.id, n = clamp(parseInt($('#npQty').value, 10) || 6, 3, 10), r = rng(hash(id)), pool = TITLES.slice(), rows = [];
  for (let i = 0; i < n; i++){
    const t = pool.splice(Math.floor(r() * pool.length), 1)[0];
    rows.push({ pack_id: id, position: i + 1, title: t, artist: ARTISTS[Math.floor(r() * ARTISTS.length)], duration_seconds: 17 + Math.floor(r() * 8), demo_seed: hash(id + t) });
  }
  const tr = await sb.from('tracks').insert(rows);
  if (tr.error){ await sb.from('packs').delete().eq('id', id); fail(); return; }
  await syncAll(true);
  closeSheet(); render();
  toast(new Date(releaseAt).getTime() <= Date.now() ? 'Pacote publicado na loja.' : 'Pacote agendado para ' + brDate(releaseAt) + '.');
}
async function removePack(id){
  if (!sb) return false;
  const res = await sb.from('packs').delete().eq('id', id);
  if (res.error){ toast('Não foi possível excluir o pacote. Confira a internet e tente de novo.'); return false; }
  UI.stack = UI.stack.filter(v => !(v.type === 'pack' && v.id === id));
  await syncAll(true);
  if (ADM.loaded) loadAdmin();
  return true;
}
function enforceAccess(){
  const ok = id => T.has(id) && canPlay(T.get(id).pack);
  if (P.id && !ok(P.id)){ stopAll(); if (UI.sheet && UI.sheet.type === 'player') UI.sheet = null; return; }
  if (P.id){ P.queue = P.queue.filter(ok); P.idx = P.queue.indexOf(P.id); }
}
const A = {
  'login-channel'(el){ UI.login.channel = el.dataset.c; UI.login.redraw = true; renderView(); },
  'login-back'(){ UI.login.step = 'form'; UI.login.redraw = true; renderView(); },
  async 'login-send'(){
    const L = UI.login; if (L.busy || !sb) return;
    if (L.step === 'form'){
      L.name = ($('#loginName') || {}).value ? $('#loginName').value.trim() : L.name;
      let bad = false;
      if (L.name.length < 2){ showErr('errName', 'Digite seu nome.'); bad = true; } else showErr('errName');
      if (L.channel === 'email'){
        L.email = $('#loginEmail').value.trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(L.email)){ showErr('errTarget', 'Digite um e-mail válido, por exemplo voce@exemplo.com.'); bad = true; } else showErr('errTarget');
      } else {
        L.phone = $('#loginPhone').value.trim();
        if (!normPhone(L.phone)){ showErr('errTarget', 'Digite o WhatsApp com DDD, por exemplo (84) 90000-0000.'); bad = true; } else showErr('errTarget');
      }
      if (bad) return;
    }
    const btn = $('#loginGo'), old = btn ? btn.textContent : '';
    L.busy = true; if (btn && L.step === 'form'){ btn.disabled = true; btn.textContent = 'Enviando código...'; }
    let res;
    try {
      res = L.channel === 'email'
        ? await sb.auth.signInWithOtp({ email: L.email, options: { shouldCreateUser: true, data: { name: L.name }, emailRedirectTo: location.origin + location.pathname } })
        : await sb.auth.signInWithOtp({ phone: normPhone(L.phone), options: { channel: 'whatsapp', shouldCreateUser: true, data: { name: L.name } } });
    } catch (e) { res = { error: e }; }
    L.busy = false;
    if (res.error){
      if (btn && L.step === 'form'){ btn.disabled = false; btn.textContent = old; }
      if (L.step === 'form') showErr('errTarget', authMsg(res.error)); else toast(authMsg(res.error));
      return;
    }
    const again = L.step === 'code';
    L.step = 'code'; L.redraw = true; renderView();
    const c = $('#loginCode'); if (c) c.focus();
    if (again) toast('Código reenviado.');
  },
  async 'login-verify'(){
    const L = UI.login; if (L.busy || !sb) return;
    const token = ($('#loginCode').value || '').replace(/\D/g, '');
    if (token.length < 6){ showErr('errCode', 'Digite o código completo que você recebeu.'); return; }
    const btn = $('#loginGo'); L.busy = true; if (btn){ btn.disabled = true; btn.textContent = 'Entrando...'; }
    let res;
    try {
      res = L.channel === 'email' ? await sb.auth.verifyOtp({ email: L.email, token: token, type: 'email' }) : await sb.auth.verifyOtp({ phone: normPhone(L.phone), token: token, type: 'sms' });
    } catch (e) { res = { error: e }; }
    L.busy = false;
    const user = res && res.data && (res.data.user || (res.data.session && res.data.session.user));
    if (res.error || !user){ if (btn){ btn.disabled = false; btn.textContent = 'Entrar'; } showErr('errCode', authMsg(res.error, 'Código inválido ou vencido. Peça um novo código.')); return; }
    await onSignedIn(user); window.scrollTo(0, 0);
  },
  async logout(){ try { if (sb) await sb.auth.signOut({ scope: 'local' }); } catch (e) {} localSignOut(); },
  async sync(){
    toast('Sincronizando...');
    const ok = await syncAll(true);
    if (UI.sheet && UI.sheet.type !== 'player') closeSheet();
    $('#view').innerHTML = ''; render();
    toast(ok ? 'Tudo atualizado.' : 'Não foi possível sincronizar. Confira a internet.');
  },
  async 'device-remove'(el){
    try { await sb.from('devices').delete().eq('id', el.dataset.id); } catch (e) {}
    const ok = await registerDevice();
    if (ok){ UI.gate = null; ACTIVE_UID = S.user.id; await syncAll(true); toast('Aparelho removido. Este aparelho foi liberado.'); } else await loadDevices();
    $('#view').innerHTML = ''; render();
  },
  tab(el){
    UI.tab = el.dataset.tab; UI.stack = [];
    if (UI.tab === 'loja'){ storePacks().forEach(p => { if (S.seen.indexOf(p.id) < 0) S.seen.push(p.id); }); save(); }
    $('#view').innerHTML = ''; render(); window.scrollTo(0, 0);
  },
  back(){ UI.stack.pop(); $('#view').innerHTML = ''; renderTop(); renderView(); },
  'open-pack'(el){ go({ type: 'pack', id: el.dataset.id }); },
  'open-list'(el){ go({ type: 'list', id: el.dataset.id }); },
  'dl-pack'(el){ const p = packById(el.dataset.id); if (p) downloadTracks(p.id, p.tracks.map(t => t.id)); },
  'dl-cancel'(){ if (DL.active) DL.active.cancel = true; },
  'dl-track'(el){ const t = T.get(el.dataset.id); closeSheet(); if (t) downloadTracks(t.pack.id, [t.id]); },
  async 'rm-track-dl'(el){ const id = el.dataset.id; if (P.id === id) stopAll(); await audioDel(id); delete S.dl[id]; P.queue = P.queue.filter(x => x !== id); save(); closeSheet(); render(); toast('Faixa removida do aparelho.'); },
  async 'rm-pack-dl'(el){
    const p = packById(el.dataset.id); if (!p) return;
    if (P.id && T.get(P.id).pack.id === p.id) stopAll();
    for (const t of p.tracks){ if (t.src === 'demo'){ await audioDel(t.id); delete S.dl[t.id]; } }
    save(); render(); toast('Pacote removido do aparelho. Ele continua na sua biblioteca.');
  },
  'play-pack'(el){ const p = packById(el.dataset.id); if (!p) return; ensureCtx(); P.shuffle = !!el.dataset.shuffle; const ids = p.tracks.map(t => t.id); playQueue(ids, P.shuffle ? ids[Math.floor(Math.random() * ids.length)] : null); },
  'play-list'(el){ ensureCtx(); P.shuffle = !!el.dataset.shuffle; const ids = listIds(el.dataset.id); playQueue(ids, P.shuffle ? ids[Math.floor(Math.random() * ids.length)] : null); },
  async 'play-track'(el){
    const id = el.dataset.id, t = T.get(id); if (!t) return;
    ensureCtx();
    if (!isOwned(t.pack)){ toast('Compre o pacote para ouvir esta faixa.'); return; }
    if (!canPlay(t.pack)){ toast('Assinatura vencida. Renove para voltar a ouvir.'); return; }
    if (P.id === id && P.buf){ toggle(); return; }
    if (!S.dl[id]){
      if (t.src !== 'demo'){ toast('Este arquivo não está mais no aparelho.'); return; }
      await downloadTracks(t.pack.id, [id], true);
      if (!S.dl[id]) return;
    }
    playQueue(ctxIds(el.dataset.ctx), id);
  },
  toggle(){ toggle(); }, next(){ next(false); }, prev(){ prev(); },
  shuffle(){ P.shuffle = !P.shuffle; renderSheet(); },
  repeat(){ P.repeat = P.repeat === 'off' ? 'all' : P.repeat === 'all' ? 'one' : 'off'; renderSheet(); },
  'queue-jump'(el){ playAt(parseInt(el.dataset.i, 10)); },
  'open-player'(){ if (P.id) openSheet({ type: 'player' }); },
  'close-sheet'(){ closeSheet(); },
  scrim(el, ev){ if (ev.target === el) closeSheet(); },
  fav(el){ const id = el.dataset.id, i = S.favs.indexOf(id); if (i >= 0) S.favs.splice(i, 1); else S.favs.push(id); save(); renderView(); if (UI.sheet && UI.sheet.type === 'player') renderSheet(); },
  more(el){ openSheet({ type: 'track', id: el.dataset.id, ctx: el.dataset.ctx }); },
  'addto-pick'(el){ const l = S.lists.find(x => x.id === el.dataset.list); if (!l) return; if (l.tracks.indexOf(el.dataset.id) < 0) l.tracks.push(el.dataset.id); save(); closeSheet(); renderView(); toast('Adicionada em “' + l.name + '”.'); },
  'rm-from-list'(el){ const l = S.lists.find(x => x.id === el.dataset.list); if (!l) return; l.tracks = l.tracks.filter(x => x !== el.dataset.id); save(); closeSheet(); renderView(); toast('Removida da lista.'); },
  'new-list'(){ openSheet({ type: 'newlist' }); const i = $('#nlName'); if (i) i.focus(); },
  'create-list'(el){
    const name = $('#nlName').value.trim();
    if (!name){ showErr('errList', 'Dê um nome à lista.'); return; }
    const l = { id: 'l' + Date.now().toString(36), name: name, tracks: el.dataset.id ? [el.dataset.id] : [] };
    S.lists.push(l); save(); closeSheet(); renderView(); toast(el.dataset.id ? 'Lista criada com a faixa adicionada.' : 'Lista criada.');
  },
  'del-list'(el){ const l = S.lists.find(x => x.id === el.dataset.id); if (!l) return; openSheet({ type: 'confirm', title: 'Apagar lista', text: 'A lista “' + l.name + '” será apagada. As faixas continuam nos seus pacotes.', yes: 'Apagar lista', act: 'del-list-yes', id: l.id }); },
  'del-list-yes'(el){ S.lists = S.lists.filter(x => x.id !== el.dataset.id); save(); UI.stack = UI.stack.filter(v => !(v.type === 'list' && v.id === el.dataset.id)); closeSheet(); $('#view').innerHTML = ''; render(); toast('Lista apagada.'); },
  buy(el){ openSheet({ type: 'contact', id: el.dataset.id }); },
  contact(){ openSheet({ type: 'contact', id: '' }); },
  'dl-all'(){ const ids = []; ownedPacks().filter(canPlay).forEach(p => p.tracks.forEach(t => ids.push(t.id))); downloadTracks('all', ids); },
  'export-zip'(el){ exportZip(el.dataset.id); },
  'admin-toggle'(){ if (!S.isAdmin) return; S.admin = !S.admin; save(); renderView(); if (S.admin) loadAdmin(); },
  'admin-tab'(el){ UI.adminTab = el.dataset.t; renderView(); if (!ADM.loaded) loadAdmin(); },
  'admin-reload'(){ ADM.err = ''; renderView(); loadAdmin(); },
  'new-pack'(){ openSheet({ type: 'newpack' }); },
  'save-pack'(){ savePack(); },
  'del-pack-ask'(el){ const p = packById(el.dataset.id); if (!p) return; openSheet({ type: 'confirm', title: 'Excluir pacote', text: '“' + p.title + '” sai da loja e da biblioteca de todos os clientes. Essa ação não pode ser desfeita.', yes: 'Excluir pacote', act: 'del-pack-yes', id: p.id }); },
  async 'del-pack-yes'(el){ const ok = await removePack(el.dataset.id); closeSheet(); render(); if (ok) toast('Pacote excluído.'); },
  async 'client-block'(el){
    const c = ADM.clients.find(x => x.id === el.dataset.id); if (!c || !sb) return;
    const who = c.name || c.email || c.phone || 'cliente';
    const res = await sb.from('profiles').update({ blocked: !c.blocked }).eq('id', c.id);
    adminDone(res, c.blocked ? 'Acesso de ' + who + ' liberado.' : 'Acesso de ' + who + ' bloqueado.', c.id);
  },
  async 'client-sub'(el){
    const id = el.dataset.id, sub = ADM.subs.find(x => x.user_id === id); if (!sb) return;
    const on = !!sub && sub.status === 'active' && new Date(sub.license_until).getTime() > Date.now();
    const until = new Date((on ? new Date(sub.license_until).getTime() : Date.now()) + 30 * 864e5).toISOString();
    const res = await sb.from('subscriptions').upsert({ user_id: id, status: 'active', license_until: until, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });

  async install(){ if (!installEvt) return; const ev = installEvt; installEvt = null; try { ev.prompt(); await ev.userChoice; } catch (e) {} renderView(); },

  async 'clear-dl-yes'(){
    stopAll();

  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) fn(el, ev);
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (ev.key === 'Escape' && UI.sheet){ closeSheet(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('[role="button"][data-a]')){ ev.preventDefault(); t.click(); return; }
  if (ev.key === 'Enter' && t.id){
    if (t.id === 'loginName' || t.id === 'loginPhone' || t.id === 'loginEmail') A['login-send']();
    else if (t.id === 'loginCode') A['login-verify']();
    else if (t.id === 'nlName'){ const b = $('#sheet [data-a="create-list"]'); if (b) b.click(); }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q'){ UI.q = t.value; $('#results').innerHTML = searchResults(); }
  else if (t.id === 'loginName') UI.login.name = t.value;
  else if (t.id === 'loginEmail') UI.login.email = t.value;
  else if (t.id === 'loginPhone') UI.login.phone = t.value;
  else if (t.id === 'seek'){ UI.seeking = true; const ct = $('#curT'); if (ct && P.buf) ct.textContent = fmt(t.value / 1000 * P.buf.duration); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'seek'){ if (P.buf) seek(t.value / 1000 * P.buf.duration); UI.seeking = false; }
  else if (t.dataset && t.dataset.grant && t.value){
    const c = ADM.clients.find(x => x.id === t.dataset.grant), p = packById(t.value);
    if (c && p && sb) sb.from('purchases').insert({ user_id: c.id, pack_id: p.id, amount_cents: Math.round(p.price * 100), source: 'admin' }).then(res => adminDone(res, '“' + p.title + '” liberado para ' + (c.name || c.email || c.phone || 'cliente') + '.', c.id));
  }
});
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); installEvt = ev; if (S.user && cur().type === 'conta') renderView(); });
window.addEventListener('appinstalled', () => { installEvt = null; renderView(); toast('App instalado na tela inicial.'); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
window.addEventListener('online', () => { renderTop(); syncAll().then(ok => { if (ok) render(); }); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncAll().then(ok => { if (ok) render(); }); });
window.addEventListener('offline', renderTop);

/* ================= início ================= */
(async function boot(){
  render();
  requestAnimationFrame(tick);
  try {
    const keys = await audioKeys(); let changed = false;
    Object.keys(S.dl).forEach(id => { if (!keys.has(id)){ delete S.dl[id]; changed = true; } });
    if (changed){ save(); renderView(); }
  } catch (e) {}
  if (!sb) return;
  sb.auth.onAuthStateChange((ev, ses) => {
    // as chamadas ao servidor saem deste retorno para não travar a biblioteca de login
    if (ev === 'SIGNED_OUT') setTimeout(() => { if (S.user) localSignOut(); }, 0);
    else if ((ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') && ses && ses.user) setTimeout(() => onSignedIn(ses.user), 0);
  });
  try {
    const res = await sb.auth.getSession();
    const ses = res && res.data && res.data.session;
    if (ses && ses.user) await onSignedIn(ses.user);
    else if (S.user && !(res && res.error)) localSignOut();
  } catch (e) {}
})();
})();
