<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Entrar · Prisma Gestão de Clínicas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">

<div class="auth-screen" x-data="loginForm()" x-init="init()" :style="branding.background_url ? ('background-image:url(\'' + branding.background_url + '\');background-size:cover;background-position:center;') : ''">
  <div class="auth-card">
    <div class="auth-logo">
      <img x-show="branding.logo_url" x-cloak :src="branding.logo_url" alt="" style="width:48px;height:48px;border-radius:var(--radius-md);object-fit:cover;">
      <div class="logo-mark" x-show="!branding.logo_url" style="background:var(--color-accent);color:var(--color-primary-dark);">P</div>
      <h1 x-text="branding.login_title || 'Prisma · Gestão de Clínicas'"></h1>
      <p x-text="branding.login_subtitle || 'Acesse o painel da sua clínica'"></p>
    </div>

    <form @submit.prevent="submit()">
      <div class="form-group">
        <label class="label" for="email">E-mail</label>
        <input class="input" type="email" id="email" x-model="email" placeholder="voce@clinica.com.br" required>
      </div>

      <div class="form-group">
        <label class="label" for="senha">Senha</label>
        <div style="position:relative;">
          <input class="input" :type="showPass ? 'text' : 'password'" id="senha" x-model="password" placeholder="••••••••" required style="padding-right:56px;">
          <button type="button" @click="showPass = !showPass" class="text-xs text-muted" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;">
            <span x-text="showPass ? 'ocultar' : 'ver'"></span>
          </button>
        </div>
      </div>

      <p x-show="errorMsg" x-cloak class="text-sm mb-3" style="color:var(--color-danger);" x-text="errorMsg"></p>

      <button class="btn btn-primary btn-block mt-2" type="submit" :disabled="loading">
        <span x-show="!loading">Entrar</span>
        <span x-show="loading" x-cloak>Entrando…</span>
      </button>
    </form>

    <div class="auth-footer">
      <span x-text="branding.support_message || 'Esqueceu a senha? Fale com a administração da clínica.'"></span><br>
      <span x-text="branding.footer_text || 'Sistema interno · Prisma Creative'"></span><br>
      <a href="solicitar-acesso.html" class="text-xs" style="color:var(--color-text-soft);">Ainda não tem acesso? Solicite aqui</a>
    </div>
  </div>
</div>

<script>
function loginForm() {
  return {
    email: '',
    password: '',
    loading: false,
    showPass: false,
    errorMsg: '',
    branding: {},

    async init() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('desativado') === '1') {
        this.errorMsg = 'Este acesso foi desativado. Fale com a administração da clínica.';
      }
      await this.loadBranding();
    },

    // Identidade visual da tela de login é definida pela equipe Prisma em
    // admin-clinicas.html (tabela platform_branding, leitura pública). Se a
    // consulta falhar por qualquer motivo (ex.: migration 029 ainda não
    // aplicada nesse ambiente), a tela cai de volta nos valores fixos --
    // login continua funcionando normalmente.
    async loadBranding() {
      try {
        const { data, error } = await supabaseClient.from('platform_branding').select('*').eq('id', 1).maybeSingle();
        if (!error && data) {
          this.branding = data;
          if (data.primary_color || data.accent_color) {
            window.applyBrandColors && window.applyBrandColors(data.primary_color, data.accent_color);
          }
        }
      } catch (err) {
        console.error('[login] erro ao carregar personalização:', err);
      }
    },

    async submit() {
      this.errorMsg = '';
      this.loading = true;
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: this.email,
        password: this.password
      });
      if (error) {
        this.errorMsg = error.message || 'E-mail ou senha incorretos.';
        this.loading = false;
        return;
      }
      let role = null;
      if (data.user) {
        // Tenta buscar o papel já com is_active; se a coluna ainda não
        // existir nesse banco (migration 018 pendente), cai para buscar só
        // o papel, pra login não parar de funcionar por causa disso.
        let profile = null;
        const withStatus = await supabaseClient.from('users').select('role, is_active').eq('id', data.user.id).single();
        if (!withStatus.error) {
          profile = withStatus.data;
        } else {
          const roleOnly = await supabaseClient.from('users').select('role').eq('id', data.user.id).single();
          profile = roleOnly.data;
        }
        role = profile ? profile.role : null;
        if (profile && profile.is_active === false) {
          await supabaseClient.auth.signOut();
          this.errorMsg = 'Este acesso foi desativado. Fale com a administração da clínica.';
          this.loading = false;
          return;
        }
      }
      window.location.href = window.homeForRole(role);
    }
  };
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/include.js" defer></script>
</body>
</html>
